services:
  # PHP 應用程式容器
  app:
    image: php:8.4-fpm
    container_name: new-app-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - itadmin-net

  # Nginx 網頁伺服器
  web:
    image: nginx:alpine
    container_name: new-app-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - itadmin-net
    depends_on:
      - app

  # 本地 MySQL 資料庫
  db:
    image: mysql:8.0
    container_name: new-app-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: itadmin_db
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - itadmin-net

networks:
  itadmin-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
